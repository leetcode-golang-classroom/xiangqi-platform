[GLOBAL]
pants_version = "2.27.0"
backend_packages = [
  "pants.backend.experimental.go",
  "pants.backend.shell",
]

[golang]
# 容許使用系統已安裝的 Go（gvm 管理的 go1.26.10）
minimum_expected_version = "1.21"

[go-test]
# 預設帶 -v 方便看測試輸出
args = ["-v"]

[tailor]
# cmd/xiangqi 以 //go:build ebiten 隔離，Pants 看不到原始碼；
# 不讓 tailor 補 go_package/go_binary，否則 `pants check ::` 會失敗。
ignore_adding_targets = ["cmd/xiangqi:xiangqi", "cmd/xiangqi:bin"]
